<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Snake MCQ Challenge</title>
  <link rel="stylesheet" href="css/style.css?v=10.0">
  <link rel="stylesheet" href="css/admin.css?v=10.0">
  <link rel="stylesheet" href="css/responsive.css?v=10.0">
</head>
<body class="admin-login-page">
  <div class="stars"></div>
  <div class="moon"></div>

  <div class="admin-login-container">
    <div class="admin-login-box">
      <div class="admin-header">
        <h1>🛡️ Admin Dashboard</h1>
        <p>Secure Administrative Panel</p>
      </div>

      <form onsubmit="handleAdminLogin(event)" id="adminLoginForm">
        <div class="form-group">
          <label for="adminUsername" class="form-label">Username</label>
          <input 
            type="text" 
            id="adminUsername" 
            class="form-input"
            placeholder="Enter admin username" 
            required
          >
        </div>

        <div class="form-group">
          <label for="adminPassword" class="form-label">Password</label>
          <input 
            type="password" 
            id="adminPassword" 
            class="form-input"
            placeholder="Enter admin password" 
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 14px; margin-top: 10px;">
          🚀 Login to Dashboard
        </button>
      </form>

      <div id="adminErrorMessage" class="form-error" style="text-align: center; margin-top: 15px;"></div>
      <div id="adminSuccessMessage" style="color: #34d399; text-align: center; margin-top: 15px; font-weight: 600;"></div>

      <div id="adminLoadingSpinner" class="flex-center" style="display: none; margin-top: 15px; gap: 10px;">
        <span class="loading"></span>
        <p style="margin: 0; color: var(--text-secondary);">Authenticating...</p>
      </div>

      <div class="admin-footer">
        <p><a href="index.html" class="nav-link">← Back to Home</a></p>
        <p class="security-note">🔒 This area is for authorized administrators only</p>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=10.0"></script>
  <script>
    async function handleAdminLogin(event) {
      event.preventDefault();

      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const errorDiv = document.getElementById('adminErrorMessage');
      const successDiv = document.getElementById('adminSuccessMessage');
      const loadingSpinner = document.getElementById('adminLoadingSpinner');
      const loginForm = document.getElementById('adminLoginForm');

      errorDiv.textContent = '';
      successDiv.textContent = '';

      if (!username || !password) {
        errorDiv.textContent = '❌ Please enter both username and password';
        return;
      }

      try {
        loadingSpinner.style.display = 'flex';
        loginForm.style.display = 'none';

        const response = await apiCall('/api/admin/login', 'POST', {
          username: username,
          password: password,
        });

        if (response.success) {
          successDiv.textContent = '✓ Login successful! Redirecting...';
          localStorage.setItem('adminId', response.adminId);
          localStorage.setItem('isAdmin', 'true');

          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 1500);
        } else {
          throw new Error(response.error || 'Login failed');
        }
      } catch (error) {
        console.error('Login error:', error);
        errorDiv.textContent = `❌ Error: ${error.message}`;
        loadingSpinner.style.display = 'none';
        loginForm.style.display = 'block';
      }
    }

    // Check if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      const isAdmin = localStorage.getItem('isAdmin');
      if (isAdmin === 'true') {
        window.location.href = 'admin-dashboard.html';
      }
    });
  </script>
</body>
</html>
