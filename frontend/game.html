<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - Snake MCQ Challenge</title>
    <link rel="stylesheet" href="css/style.css?v=10.0">
    <link rel="stylesheet" href="css/responsive.css?v=10.0">
    <link rel="stylesheet" href="css/game.css?v=10.0">
</head>
<body>
    <div class="stars"></div>
    <div class="moon"></div>

    <div class="game-container">
        <!-- Game Header / Arcade HUD -->
        <div class="game-header">
            <div class="game-header-item">
                <span class="game-label">Language</span>
                <span class="game-value" id="languageDisplay">-</span>
            </div>
            <div class="game-header-item">
                <span class="game-label">Question</span>
                <span class="game-value" id="questionNum">1/20</span>
            </div>
            <div class="game-header-item">
                <span class="game-label">Score</span>
                <span class="game-value" id="score" style="color: #34d399;">0</span>
            </div>
            <div class="game-header-item">
                <span class="game-label">Phase Time</span>
                <span class="game-value" id="timer" style="color: #f59e0b;">20s</span>
            </div>
            <div class="game-header-item">
                <span class="game-label">Total Real Time</span>
                <span class="game-value" id="realTimer" style="color: #38bdf8;">00:00</span>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <div class="game-content">
                <!-- Question Screen -->
                <div id="questionScreen" class="screen active">
                    <div class="question-box">
                        <h2 id="questionText">Loading question...</h2>
                        <div class="options-container">
                            <div class="option-box" id="optA">
                                <span class="option-label">A</span>
                                <span class="option-text" id="optAText">-</span>
                            </div>
                            <div class="option-box" id="optB">
                                <span class="option-label">B</span>
                                <span class="option-text" id="optBText">-</span>
                            </div>
                            <div class="option-box" id="optC">
                                <span class="option-label">C</span>
                                <span class="option-text" id="optCText">-</span>
                            </div>
                            <div class="option-box" id="optD">
                                <span class="option-label">D</span>
                                <span class="option-text" id="optDText">-</span>
                            </div>
                        </div>
                        <div style="text-align: center; margin-top: 30px;">
                            <button class="btn btn-primary btn-large" onclick="skipToGame()">
                                🚀 NEXT: Play Snake Game
                            </button>
                            <p style="color: var(--text-secondary); margin-top: 15px; font-size: 0.95rem;">
                                or wait <span id="autoRedirectCount" style="color: #38bdf8; font-weight: bold;">20</span>s for automatic redirect
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Snake Game Screen -->
                <div id="gameScreen" class="screen">
                    <canvas id="gameCanvas" class="game-board" width="600" height="600"></canvas>
                </div>

                <!-- Result Screen -->
                <div id="resultScreen" class="screen">
                    <div class="result-box">
                        <div id="resultMessage"></div>
                        <div id="resultPoints"></div>
                        <button class="btn btn-primary btn-large" onclick="nextQuestion()">Next Question ➔</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Controls - ONLY VISIBLE ON GAME SCREEN -->
        <div class="game-controls" id="gameControls" style="display: none;">
            <button id="upBtn" class="control-btn" onclick="moveSnake('UP')" ontouchstart="moveSnake('UP'); event.preventDefault();">▲</button>
            <div style="display: flex; gap: 12px;">
                <button id="leftBtn" class="control-btn" onclick="moveSnake('LEFT')" ontouchstart="moveSnake('LEFT'); event.preventDefault();">◀</button>
                <button id="downBtn" class="control-btn" onclick="moveSnake('DOWN')" ontouchstart="moveSnake('DOWN'); event.preventDefault();">▼</button>
                <button id="rightBtn" class="control-btn" onclick="moveSnake('RIGHT')" ontouchstart="moveSnake('RIGHT'); event.preventDefault();">▶</button>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=10.0"></script>
    <script src="js/app.js?v=10.0"></script>
    <script src="js/snake-simple.js?v=10.0"></script>
    <script>
        // Game constants
        const READING_TIME = 20;
        const GAME_TIME = 30;

        // Game state - restore currentQuestion from localStorage on refresh
        var currentQuestion = parseInt(localStorage.getItem('currentQuestion') || '1') || 1;
        var phaseTimer = null;
        var realTimerInterval = null;
        var gameStartTimestamp = null;
        var timeRemaining = READING_TIME;
        var isReadingPhase = true;
        var currentGameData = null;

        // =====================================================
        // INIT - runs on page load (handles refresh recovery)
        // =====================================================
        document.addEventListener('DOMContentLoaded', async () => {
            requireLogin();

            try {
                const selectedLanguage = localStorage.getItem('selectedLanguage') || 'python';
                document.getElementById('languageDisplay').textContent = selectedLanguage.toUpperCase();

                const sessionToken = localStorage.getItem(STORAGE_KEYS.SESSION_TOKEN) || localStorage.getItem('sessionToken');
                if (!sessionToken) {
                    window.location.href = 'login.html';
                    return;
                }

                // === REFRESH RECOVERY: sync state from server ===
                try {
                    const statsResp = await Game.getStats();
                    if (statsResp && statsResp.data) {
                        const s = statsResp.data;

                        // Already completed? Redirect straight to summary
                        if (s.status === 'completed') {
                            console.log('✅ Game already completed, redirecting to summary...');
                            window.location.href = 'summary.html';
                            return;
                        }

                        // Restore score display
                        document.getElementById('score').textContent = s.score || 0;

                        // Sync question number from server answered count (authoritative)
                        const answered = s.questionsAnswered || 0;
                        if (answered > 0) {
                            const serverNextQ = answered + 1;
                            if (serverNextQ > currentQuestion) {
                                currentQuestion = serverNextQ;
                                localStorage.setItem('currentQuestion', String(currentQuestion));
                            }
                        }

                        if (currentQuestion > 20) {
                            window.location.href = 'summary.html';
                            return;
                        }
                    }
                } catch (e) {
                    console.warn('Could not restore stats on refresh, continuing with saved state:', e.message);
                }

                console.log(`▶️ Starting from question ${currentQuestion}/20`);
                document.getElementById('questionNum').textContent = `${currentQuestion}/20`;

                startReadingPhase();

            } catch (error) {
                console.error('Game initialization error:', error);
                alert('An error occurred while starting the game.');
                window.location.href = 'login.html';
            }
        });

        // =====================================================
        // REAL TIMER (persists across refresh via localStorage)
        // =====================================================
        function startRealGameTimer() {
            if (realTimerInterval) clearInterval(realTimerInterval);
            const savedStart = localStorage.getItem('gameStartTime');
            if (!savedStart) {
                gameStartTimestamp = Date.now();
                localStorage.setItem('gameStartTime', String(gameStartTimestamp));
            } else {
                gameStartTimestamp = parseInt(savedStart);
            }
            updateRealTimerDisplay();
            realTimerInterval = setInterval(updateRealTimerDisplay, 1000);
        }

        function updateRealTimerDisplay() {
            if (!gameStartTimestamp) return;
            const elapsedSecs = Math.max(0, Math.floor((Date.now() - gameStartTimestamp) / 1000));
            const mins = Math.floor(elapsedSecs / 60);
            const secs = elapsedSecs % 60;
            const el = document.getElementById('realTimer');
            if (el) el.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        }

        // =====================================================
        // PHASE: READING
        // =====================================================
        function startReadingPhase() {
            console.log('📖 Starting reading phase...');
            isReadingPhase = true;
            timeRemaining = READING_TIME;

            startRealGameTimer();

            document.getElementById('questionScreen').classList.add('active');
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('gameControls').style.display = 'none';

            loadQuestion();

            startPhaseTimer(READING_TIME, () => {
                console.log('⏱️ Reading time ended, starting snake game...');
                startGamePhase();
            });
        }

        async function loadQuestion() {
            try {
                const selectedLanguage = localStorage.getItem('selectedLanguage') || 'python';
                console.log(`📥 Loading question ${currentQuestion}, language: ${selectedLanguage}`);

                let data;
                try {
                    data = await Game.getQuestion(currentQuestion, selectedLanguage);
                } catch (err) {
                    console.warn('getQuestion failed, refreshing session:', err);
                    await Game.startGame();
                    data = await Game.getQuestion(currentQuestion, selectedLanguage);
                }

                if (!data || !data.success || !data.data || !data.data.question) {
                    throw new Error((data && data.error) || 'Invalid question response');
                }

                const question = data.data.question;
                currentGameData = question;
                window.currentGameData = question;

                document.getElementById('questionText').textContent = question.text || 'No question text';
                document.getElementById('optAText').textContent = question.options?.A || '-';
                document.getElementById('optBText').textContent = question.options?.B || '-';
                document.getElementById('optCText').textContent = question.options?.C || '-';
                document.getElementById('optDText').textContent = question.options?.D || '-';
                document.getElementById('questionNum').textContent = `${currentQuestion}/20`;

                console.log('✓ Question loaded');
            } catch (error) {
                console.error('❌ Error loading question:', error);
                document.getElementById('questionText').textContent = 'Error loading question: ' + error.message;
            }
        }

        // =====================================================
        // PHASE TIMER
        // =====================================================
        function startPhaseTimer(duration, onComplete) {
            if (phaseTimer) clearInterval(phaseTimer);
            timeRemaining = duration;
            updateTimerDisplay();
            phaseTimer = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                if (timeRemaining <= 0) {
                    clearInterval(phaseTimer);
                    phaseTimer = null;
                    if (onComplete) onComplete();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer').textContent = timeRemaining + 's';
            document.getElementById('autoRedirectCount').textContent = timeRemaining;
        }

        function skipToGame() {
            console.log('⏭️ Skipping to snake game...');
            if (phaseTimer) clearInterval(phaseTimer);
            startGamePhase();
        }

        // =====================================================
        // PHASE: SNAKE GAME
        // =====================================================
        function startGamePhase() {
            console.log('%c🎮 Starting snake game...', 'color: cyan; font-weight: bold');
            isReadingPhase = false;

            document.getElementById('questionScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('gameControls').style.display = 'flex';

            if (!document.getElementById('gameCanvas')) {
                console.error('❌ Canvas not found!');
                return;
            }

            setTimeout(() => {
                if (typeof window.initSnakeGame === 'function') {
                    try {
                        window.initSnakeGame();
                        console.log('✅ Snake game initialized');
                    } catch (e) {
                        console.error('❌ Snake init error:', e);
                    }
                } else {
                    console.error('❌ initSnakeGame not found!');
                }
            }, 100);

            startPhaseTimer(GAME_TIME, () => {
                console.log('⏱️ Game time ended');
                endSnakeGame();
            });
        }

        function endSnakeGame() {
            console.log('🏁 Snake game ended');
            if (phaseTimer) clearInterval(phaseTimer);
            showResult(false, 0);
        }

        // =====================================================
        // CONTROLS
        // =====================================================
        function moveSnake(direction) {
            if (typeof window.moveSnakeByButton === 'function') {
                window.moveSnakeByButton(direction);
            }
        }

        // =====================================================
        // NEXT QUESTION / GAME COMPLETE
        // =====================================================
        async function nextQuestion() {
            currentQuestion++;

            if (currentQuestion > 20) {
                // Game complete
                console.log('🎉 Game completed!');
                if (realTimerInterval) clearInterval(realTimerInterval);

                const startTime = parseInt(localStorage.getItem('gameStartTime') || String(Date.now()));
                const totalSecs = Math.max(1, Math.round((Date.now() - startTime) / 1000));
                const mins = Math.floor(totalSecs / 60);
                const secs = totalSecs % 60;
                const formattedTime = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;

                localStorage.setItem('lastGameTotalTime', formattedTime);
                localStorage.setItem('lastGameTotalSeconds', String(totalSecs));
                localStorage.removeItem('currentQuestion'); // Clear so next game starts fresh
                console.log(`⏱️ Total game time: ${formattedTime} (${totalSecs}s)`);

                try {
                    const res = await Game.completeGame(totalSecs);
                    if (res && res.user) {
                        localStorage.setItem('playerGameSummary', JSON.stringify(res.user));
                    }
                } catch (e) {
                    console.error('Complete game error:', e);
                }
                window.location.href = 'summary.html';

            } else {
                console.log(`📖 Moving to question ${currentQuestion}...`);
                // Persist so browser refresh resumes at this question
                localStorage.setItem('currentQuestion', String(currentQuestion));
                if (phaseTimer) clearInterval(phaseTimer);
                startReadingPhase();
            }
        }

        // =====================================================
        // RESULT SCREEN
        // =====================================================
        function showResult(isCorrect, points) {
            console.log(`Result: ${isCorrect ? '✓ CORRECT' : '✗ WRONG'} (+${points} pts)`);

            document.getElementById('questionScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');

            const msgEl = document.getElementById('resultMessage');
            const ptEl = document.getElementById('resultPoints');

            if (isCorrect) {
                msgEl.textContent = '✓ CORRECT!';
                msgEl.style.color = '#34d399';
                ptEl.textContent = `+${points} Points`;
            } else {
                msgEl.textContent = '✗ WRONG';
                msgEl.style.color = '#ef4444';
                ptEl.textContent = '+0 Points';
            }
        }
    </script>
</body>
</html>
