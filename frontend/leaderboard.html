<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Snake MCQ Challenge</title>
    <link rel="stylesheet" href="css/style.css?v=10.0">
    <link rel="stylesheet" href="css/responsive.css?v=10.0">
    <style>
        .leaderboard-card {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.2);
            backdrop-filter: blur(16px);
        }

        .leaderboard-table-styled {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table-styled th {
            padding: 18px 20px;
            text-align: left;
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 700;
            color: #a78bfa;
            border-bottom: 2px solid var(--border-color);
            background: rgba(139, 92, 246, 0.1);
        }

        .leaderboard-table-styled td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            font-size: 0.98rem;
        }

        .leaderboard-table-styled tr:hover {
            background: rgba(139, 92, 246, 0.08);
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="moon"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🐍</span>
                <span class="logo-text">SNAKE MCQ</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="#" onclick="logout()" class="nav-link btn-primary">Logout</a>
            </div>
        </div>
    </nav>

    <div style="padding: 50px 20px; min-height: 85vh;">
        <div class="container">
            <h2 class="section-title"><span>🏆 Leaderboard</span></h2>
            
            <div style="background: rgba(15, 23, 42, 0.7); border: 1.5px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 30px; backdrop-filter: blur(12px);">
                <div class="filter-container" style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn btn-primary btn-small" onclick="loadLeaderboard(10, this)">Top 10</button>
                    <button class="btn btn-secondary btn-small" onclick="loadLeaderboard(20, this)">Top 20</button>
                    <button class="btn btn-secondary btn-small" onclick="loadLeaderboard(50, this)">Top 50</button>
                    <button class="btn btn-secondary btn-small" onclick="loadLeaderboard(100, this)">Top 100</button>
                    <button class="btn btn-secondary btn-small" onclick="loadLeaderboard(null, this)">All</button>
                </div>
            </div>

            <div class="leaderboard-card">
                <div style="overflow-x: auto;">
                    <table class="leaderboard-table-styled">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Player Name</th>
                                <th>Roll Number</th>
                                <th>Class</th>
                                <th style="text-align: center;">Score</th>
                                <th style="text-align: center;">Total Time</th>
                                <th style="text-align: center;">Completed</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardTable">
                            <tr>
                                <td colspan="7" style="padding: 30px; text-align: center; color: var(--text-tertiary);">Loading leaderboard...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div style="text-align: center; margin-top: 35px; display: flex; justify-content: center; gap: 16px;">
                <a href="index.html" class="btn btn-primary btn-large">Back to Home</a>
                <a href="login.html" class="btn btn-secondary btn-large" onclick="logout()">Play Again</a>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=10.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isAdmin = localStorage.getItem('isAdmin');
            if (isAdmin !== 'true') {
                alert('Notice: The global leaderboard is restricted to Admin users.');
                window.location.href = 'summary.html';
                return;
            }
            loadLeaderboard(10);
        });

        function formatPlayerTime(seconds) {
            if (!seconds || isNaN(seconds) || seconds <= 0) return 'N/A';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
        }

        async function loadLeaderboard(limit, targetBtn) {
            try {
                if (targetBtn) {
                    document.querySelectorAll('.filter-container button').forEach(btn => {
                        btn.classList.remove('btn-primary');
                        btn.classList.add('btn-secondary');
                    });
                    targetBtn.classList.remove('btn-secondary');
                    targetBtn.classList.add('btn-primary');
                }

                let url = `${API_BASE}/leaderboard`;
                if (limit) {
                    url += `?limit=${limit}`;
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                const tbody = document.getElementById('leaderboardTable');
                tbody.innerHTML = '';
                
                const players = data.players || (Array.isArray(data.data) ? data.data : (data.data && data.data.leaderboard)) || [];
                
                if (data.success && players.length > 0) {
                    players.forEach((player, index) => {
                        const row = document.createElement('tr');
                        row.style.borderBottom = '1px solid rgba(255, 255, 255, 0.06)';
                        row.style.color = 'var(--text-secondary)';
                        
                        if (index % 2 === 0) {
                            row.style.background = 'rgba(139, 92, 246, 0.04)';
                        }
                        
                        const medal = player.medal || (index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '');
                        const displayTime = player.formatted_time || formatPlayerTime(player.total_time_seconds);

                        row.innerHTML = `
                            <td style="padding: 16px 20px;">
                                <strong style="color: #38bdf8; font-family: var(--font-display); font-size: 1.1rem;">#${player.rank || index + 1} ${medal}</strong>
                            </td>
                            <td style="padding: 16px 20px;">
                                <strong style="color: #ffffff;">${player.name}</strong>
                            </td>
                            <td style="padding: 16px 20px;">${player.roll_number}</td>
                            <td style="padding: 16px 20px;">${player.class || '-'}</td>
                            <td style="padding: 16px 20px; text-align: center;">
                                <strong style="color: #34d399; font-family: var(--font-display); font-size: 1.1rem;">${player.score}</strong>
                            </td>
                            <td style="padding: 16px 20px; text-align: center;">
                                <span style="color: #38bdf8; font-weight: 700; font-family: var(--font-display);">⏱️ ${displayTime}</span>
                            </td>
                            <td style="padding: 16px 20px; text-align: center;">
                                ${player.formatted_date || (player.completed_at ? new Date(player.completed_at).toLocaleString() : 'In Progress')}
                            </td>
                        `;
                        
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="padding: 30px; text-align: center; color: var(--text-tertiary);">No players on leaderboard yet</td></tr>';
                }
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('leaderboardTable').innerHTML = '<tr><td colspan="7" style="padding: 30px; text-align: center; color: var(--danger-color);">Error loading leaderboard</td></tr>';
            }
        }

        function logout() {
            localStorage.removeItem(STORAGE_KEYS.USER_TOKEN);
            localStorage.removeItem(STORAGE_KEYS.SESSION_TOKEN);
            localStorage.removeItem(STORAGE_KEYS.USER_ID);
            localStorage.removeItem(STORAGE_KEYS.ROLL_NUMBER);
            localStorage.removeItem(STORAGE_KEYS.USER_NAME);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
