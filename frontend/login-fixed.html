<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Snake MCQ Challenge</title>
  <link rel="stylesheet" href="css/style.css?v=6.0">
  <link rel="stylesheet" href="css/responsive.css?v=6.0">
  <style>
    .debug-info {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid #8b5cf6;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 11px;
      color: #34d399;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="login-page">
  <div class="stars"></div>
  <div class="moon"></div>

  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="form-container" style="max-width: 480px;">
      <div style="text-align: center; margin-bottom: 25px;">
        <div style="font-size: 3rem; margin-bottom: 8px; animation: floatIcon 3s ease-in-out infinite;">🐍</div>
        <h1 style="font-family: var(--font-heading); font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px;">
          Snake MCQ Challenge
        </h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">Competitive Programming Quiz</p>
      </div>

      <div id="loginForm">
        <h2 style="font-family: var(--font-heading); font-size: 1.3rem; margin-bottom: 20px; color: var(--text-primary); text-align: center;">Player Registration</h2>
        
        <div class="form-group">
          <label for="playerName" class="form-label">Your Name</label>
          <input 
            type="text" 
            id="playerName" 
            class="form-input"
            placeholder="Enter your full name" 
            required
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label for="playerClass" class="form-label">Class</label>
          <select id="playerClass" class="form-input" required>
            <option value="" disabled selected>Select Class</option>
            <option value="SYCS">SYCS</option>
            <option value="SYIT">SYIT</option>
            <option value="SYAI">SYAI</option>
            <option value="SYDS">SYDS</option>
          </select>
        </div>

        <div class="form-group">
          <label for="rollNumber" class="form-label">Roll Number / ID</label>
          <input 
            type="text" 
            id="rollNumber" 
            class="form-input"
            placeholder="Enter your roll number or ID" 
            required
            autocomplete="off"
          >
        </div>

        <button type="button" id="submitBtn" class="btn btn-primary btn-block" style="padding: 14px; margin-top: 10px;">🚀 Start Challenge</button>

        <div id="errorMessage" class="form-error" style="text-align: center; margin-top: 15px;"></div>
        <div id="successMessage" style="color: #34d399; text-align: center; margin-top: 15px; font-weight: 600;"></div>
      </div>

      <div id="loadingSpinner" class="flex-center" style="display: none; padding: 20px 0; gap: 10px;">
        <span class="loading"></span>
        <p style="margin: 0; color: var(--text-secondary);">Starting your challenge...</p>
      </div>

      <div style="margin-top: 25px; text-align: center;">
        <p><a href="index.html" class="nav-link">← Back to Home</a></p>
        <p style="color: var(--warning-color); font-size: 0.85rem; margin-top: 8px;">💡 Tip: Use the same roll number if you join again</p>
      </div>
    </div>
  </div>

  <div class="debug-info" id="debugInfo">Ready</div>

  <script src="js/api.js?v=6.0"></script>
  <script>
    console.log('✅ Login page loaded');
    
    // Get DOM elements
    const playerNameInput = document.getElementById('playerName');
    const rollNumberInput = document.getElementById('rollNumber');
    const submitBtn = document.getElementById('submitBtn');
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const loginForm = document.getElementById('loginForm');
    const debugInfo = document.getElementById('debugInfo');

    // Update debug info
    function updateDebug(msg) {
      console.log(msg);
      debugInfo.textContent = msg;
    }

    // Handle submit button click
    submitBtn.addEventListener('click', async function() {
      updateDebug('Button clicked...');
      await handleLogin();
    });

    // Handle Enter key
    rollNumberInput.addEventListener('keypress', async function(e) {
      if (e.key === 'Enter') {
        updateDebug('Enter pressed...');
        await handleLogin();
      }
    });

    // Main login function
    async function handleLogin() {
      const playerName = playerNameInput.value.trim();
      const playerClassVal = (document.getElementById('playerClass') ? document.getElementById('playerClass').value : '').trim();
      const rollNumber = rollNumberInput.value.trim();

      updateDebug('Validating inputs...');
      console.log('Name:', playerName, 'Class:', playerClassVal, 'Roll:', rollNumber);

      // Clear messages
      errorDiv.textContent = '';
      successDiv.textContent = '';

      // Validation
      if (!playerName || playerName.length < 1) {
        errorDiv.textContent = '❌ Please enter a valid name';
        updateDebug('Name validation failed');
        return;
      }

      if (!playerClassVal || playerClassVal.length < 1) {
        errorDiv.textContent = '❌ Please select a class (SYCS, SYIT, SYAI, SYDS)';
        updateDebug('Class validation failed');
        return;
      }

      if (!rollNumber || rollNumber.length < 1) {
        errorDiv.textContent = '❌ Please enter a valid roll number';
        updateDebug('Roll number validation failed');
        return;
      }

      try {
        // Show loading
        updateDebug('Sending registration...');
        loadingSpinner.style.display = 'flex';
        loginForm.style.display = 'none';

        const response = await Auth.loginPlayer(playerName, playerClassVal, rollNumber);

        console.log('API Response:', response);
        updateDebug('Response received');

        if (response.success) {
          updateDebug('Registration successful!');
          successDiv.textContent = '✓ Registration successful! Redirecting in 2 seconds...';
          
          // Store session data
          localStorage.setItem('userId', response.userId);
          localStorage.setItem('sessionToken', response.sessionToken);
          localStorage.setItem('sessionId', response.sessionId);
          localStorage.setItem('playerName', playerName);
          localStorage.setItem('rollNumber', rollNumber);

          console.log('Session data stored:', {
            userId: response.userId,
            sessionId: response.sessionId,
            playerName: playerName,
            rollNumber: rollNumber
          });

          // Redirect to game after 2 seconds
          setTimeout(() => {
            updateDebug('Redirecting to game...');
            window.location.href = 'game.html';
          }, 2000);
        } else {
          throw new Error(response.error || 'Registration failed');
        }
      } catch (error) {
        console.error('Login error:', error);
        updateDebug('Error: ' + error.message);
        errorDiv.textContent = `❌ Error: ${error.message}`;
        
        // Show form again
        loadingSpinner.style.display = 'none';
        loginForm.style.display = 'block';

        // If duplicate, allow login
        if (error.message.includes('already')) {
          updateDebug('Attempting login with existing account...');
          errorDiv.innerHTML += '<br><small>Attempting login with existing account...</small>';
          
          try {
            const loginResponse = await apiCall('/api/auth/login', 'POST', {
              rollNumber: rollNumber,
            });

            if (loginResponse.success) {
              localStorage.setItem('userId', loginResponse.userId);
              localStorage.setItem('sessionToken', loginResponse.sessionToken);
              localStorage.setItem('sessionId', loginResponse.sessionId);
              localStorage.setItem('playerName', playerName);
              localStorage.setItem('rollNumber', rollNumber);

              updateDebug('Login successful!');
              successDiv.textContent = '✓ Logged in! Redirecting...';
              setTimeout(() => {
                window.location.href = 'game.html';
              }, 1500);
            }
          } catch (loginError) {
            console.error('Login retry error:', loginError);
            updateDebug('Login failed: ' + loginError.message);
          }
        }
      }
    }

    // Check if already logged in
    window.addEventListener('load', () => {
      const sessionToken = localStorage.getItem('sessionToken');
      if (sessionToken) {
        updateDebug('Already logged in, redirecting...');
        window.location.href = 'game.html';
      }
    });
  </script>
</body>
</html>
