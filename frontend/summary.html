<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Summary - Snake MCQ Challenge</title>
    <link rel="stylesheet" href="css/style.css?v=6.0">
    <link rel="stylesheet" href="css/responsive.css?v=6.0">
    <style>
        .summary-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .summary-card {
            background: rgba(15, 23, 42, 0.88);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 45px;
            max-width: 680px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(139, 92, 246, 0.25);
            backdrop-filter: blur(16px);
            animation: slideUp 0.4s ease-out;
        }

        .summary-header {
            text-align: center;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 25px;
            margin-bottom: 30px;
        }

        .summary-title {
            font-family: var(--font-heading);
            font-size: 2.3rem;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .summary-badge {
            display: inline-block;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: #ffffff;
            padding: 8px 22px;
            border-radius: 25px;
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        .player-profile-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(6, 8, 20, 0.6);
            border-radius: 14px;
            padding: 18px 24px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .player-info-item {
            display: flex;
            flex-direction: column;
        }

        .player-info-label {
            color: var(--text-tertiary);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .player-info-value {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 22px;
            text-align: center;
            transition: var(--transition);
        }

        .stat-box.highlight {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(6, 182, 212, 0.15));
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
        }

        .stat-icon {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .stat-label {
            color: var(--text-tertiary);
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
        }

        .stat-value.success { color: #34d399; }
        .stat-value.danger { color: #f87171; }
        .stat-value.warning { color: #fbbf24; }
        .stat-value.primary { color: #38bdf8; }

        .summary-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .player-profile-bar {
                flex-direction: column;
                gap: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="moon"></div>

    <div class="summary-container">
        <div class="summary-card">
            <div class="summary-header">
                <div class="summary-title">🎉 Challenge Completed!</div>
                <div class="summary-badge" id="performanceBadge">COMPLETED</div>
            </div>

            <!-- Player Profile Bar -->
            <div class="player-profile-bar">
                <div class="player-info-item">
                    <span class="player-info-label">Player Name</span>
                    <span class="player-info-value" id="summaryPlayerName">-</span>
                </div>
                <div class="player-info-item">
                    <span class="player-info-label">Roll Number</span>
                    <span class="player-info-value" id="summaryRollNum">-</span>
                </div>
                <div class="player-info-item">
                    <span class="player-info-label">Class</span>
                    <span class="player-info-value" id="summaryClass">-</span>
                </div>
                <div class="player-info-item">
                    <span class="player-info-label">Language</span>
                    <span class="player-info-value" id="summaryLang">-</span>
                </div>
            </div>

            <!-- Detailed Stats Grid -->
            <div class="stats-grid">
                <div class="stat-box highlight">
                    <div class="stat-icon">🏆</div>
                    <div class="stat-label">TOTAL SCORE</div>
                    <div class="stat-value primary" id="summaryScore">0</div>
                </div>

                <div class="stat-box highlight">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-label">TOTAL TIME TAKEN</div>
                    <div class="stat-value primary" id="summaryTotalTime">0s</div>
                </div>

                <div class="stat-box">
                    <div class="stat-icon">✅</div>
                    <div class="stat-label">CORRECT ANSWERS</div>
                    <div class="stat-value success" id="summaryCorrect">0 / 20</div>
                </div>

                <div class="stat-box">
                    <div class="stat-icon">❌</div>
                    <div class="stat-label">WRONG ANSWERS</div>
                    <div class="stat-value danger" id="summaryWrong">0 / 20</div>
                </div>
            </div>

            <div class="summary-actions">
                <button onclick="playAgain()" class="btn btn-primary btn-large">🎮 Play Again</button>
                <button onclick="userLogout()" class="btn btn-secondary btn-large">🚪 Logout</button>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=6.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSummaryData();
        });

        function loadSummaryData() {
            // Retrieve player summary from localStorage
            const name = localStorage.getItem(STORAGE_KEYS.USER_NAME) || localStorage.getItem('playerName') || 'Player';
            const roll = localStorage.getItem(STORAGE_KEYS.ROLL_NUMBER) || localStorage.getItem('rollNumber') || '-';
            const defaultClass = localStorage.getItem('snakemcq_user_class') || localStorage.getItem('playerClass') || localStorage.getItem('userClass') || '-';
            const lang = (localStorage.getItem('selectedLanguage') || 'python').toUpperCase();
            
            const rawSummary = localStorage.getItem('playerGameSummary');
            let summaryData = {};
            if (rawSummary) {
                try { summaryData = JSON.parse(rawSummary); } catch (e) {}
            }

            const pClass = summaryData.class || summaryData.className || defaultClass;

            const score = summaryData.score !== undefined ? summaryData.score : (localStorage.getItem('lastGameScore') || 0);
            const correct = summaryData.correct_answers !== undefined ? summaryData.correct_answers : (localStorage.getItem('lastGameCorrect') || 0);
            const wrong = summaryData.wrong_answers !== undefined ? summaryData.wrong_answers : (localStorage.getItem('lastGameWrong') || 0);
            const skipped = summaryData.skipped_answers !== undefined ? summaryData.skipped_answers : (localStorage.getItem('lastGameSkipped') || 0);
            
            const totalTime = summaryData.formattedTime || localStorage.getItem('lastGameTotalTime') || 'N/A';
            const accuracy = Math.round((correct / 20) * 100);

            // Populate UI
            document.getElementById('summaryPlayerName').textContent = name;
            document.getElementById('summaryRollNum').textContent = roll;
            document.getElementById('summaryClass').textContent = pClass && pClass !== '' ? pClass : '-';
            document.getElementById('summaryLang').textContent = lang;
            
            document.getElementById('summaryScore').textContent = `${score} pts`;
            document.getElementById('summaryTotalTime').textContent = totalTime;
            document.getElementById('summaryCorrect').textContent = `${correct} / 20`;
            document.getElementById('summaryWrong').textContent = `${wrong} / 20`;

            // Performance badge
            const badgeEl = document.getElementById('performanceBadge');
            if (accuracy >= 80) {
                badgeEl.textContent = '🌟 GOLD MASTER';
                badgeEl.style.background = 'linear-gradient(135deg, #eab308, #f59e0b)';
            } else if (accuracy >= 50) {
                badgeEl.textContent = '🥈 SILVER CODER';
                badgeEl.style.background = 'linear-gradient(135deg, #06b6d4, #3b82f6)';
            } else {
                badgeEl.textContent = '🥉 BRONZE DEVELOPER';
                badgeEl.style.background = 'linear-gradient(135deg, #a855f7, #6366f1)';
            }
        }

        function playAgain() {
            window.location.href = 'language-selection.html';
        }

        function userLogout() {
            Auth.logout();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
