<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="css/style.css?v=6.0">
    <link rel="stylesheet" href="css/responsive.css?v=6.0">
</head>
<body>
    <div class="stars"></div>
    <div class="moon"></div>

    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div class="form-container" style="text-align: center; max-width: 520px;">
            <div style="font-size: 4rem; margin-bottom: 10px;">🐍</div>
            <h1 style="font-family: var(--font-display); font-size: 4.5rem; font-weight: 900; background: linear-gradient(135deg, #a78bfa, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px;">
                404
            </h1>
            <h2 style="font-family: var(--font-heading); font-size: 1.6rem; margin-bottom: 15px; color: var(--text-secondary);">Page Not Found</h2>
            <p style="color: var(--text-tertiary); margin-bottom: 30px; font-size: 1rem;">
                The page you're looking for doesn't exist or has been moved.
            </p>
            
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <a href="index.html" class="btn btn-primary">🏠 Home</a>
                <a href="login.html" class="btn btn-secondary">🎮 Login</a>
                <a href="leaderboard.html" class="btn btn-secondary">🏆 Leaderboard</a>
            </div>
        </div>
    </div>
</body>
</html>
